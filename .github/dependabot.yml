version: 2
updates: 
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    cooldown:
      default-days: 7
    labels:
      - "kind/dependencies"
  - package-ecosystem: "cargo"
    directories: 
      - "/"
      # Standalone workspace with its own Cargo.lock, validated by `just check-fixture-lock`
      - "/src/hyperlight-js-runtime/tests/fixtures/extended_runtime"
    schedule:
      interval: "daily"
      time: "03:00"
    cooldown:
      default-days: 7
    labels:
      - "kind/dependencies"
  - package-ecosystem: "npm"
    directories: 
      - "/src/js-host-api"
      - "/src/js-host-api/examples/mcp-server"
    schedule:
      interval: "daily"
      time: "03:00"
    cooldown:
      default-days: 7
    labels:
      - "kind/dependencies"