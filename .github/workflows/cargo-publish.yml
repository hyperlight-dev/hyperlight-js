# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: false
  # IMPORTANT: Trusted publishing (OIDC) is configured on crates.io with
  # workflow filename 'CreateRelease.yml'. crates.io checks the *calling* workflow
  # for workflow_call, not the reusable workflow that runs cargo publish.
  # Calling this workflow from a different parent workflow will fail OIDC auth.
  # See: https://crates.io/docs/trusted-publishing
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish-hyperlight-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Ensures just is installed using setup wokflow to ensure just version consistency
      - name: Hyperlight setup
        uses: hyperlight-dev/ci-setup-workflow@59673866360458f8dd035f4a9fa766aeebad2038 # v2.3.1
        with:
          additional-toolchain-directory: src/hyperlight-js-runtime
          just-version: "1.51"
    
      - name: Install cargo-overlay-registry
        run: cargo install cargo-overlay-registry

      - name: Determine which crates need publishing
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          needs_publish() {
            local crate=$1
            local crate_env_var=$(echo "$crate" | tr '[:lower:]' '[:upper:]' | tr '-' '_')

            if [ -z "$VERSION" ] || [ "$VERSION" == "v0.0.0" ] || [ "$VERSION" == "0.0.0" ]; then
              echo "No version set (dry run?), skipping crates.io existence checks."
              echo "PUBLISH_${crate_env_var}=true" >> "$GITHUB_ENV"
              return
            fi

            # Query crates.io from /tmp in a subshell so `cargo info` does not
            # read the workspace manifest or lockfile. The subshell exits
            # back to the original PWD automatically. `--locked` is omitted
            # because there is no Cargo.lock in /tmp.
            if (cd /tmp && cargo info -q "$crate"@"$VERSION") > /dev/null; then
              echo "PUBLISH_${crate_env_var}=false" >> "$GITHUB_ENV"
              echo "✅ $crate@$VERSION already exists."
            else
              echo "PUBLISH_${crate_env_var}=true" >> "$GITHUB_ENV"
              echo "🚀 $crate@$VERSION will be published."
            fi
          }
          
          needs_publish hyperlight-js-common
          needs_publish hyperlight-js-runtime
          needs_publish hyperlight-js
    
      - name: Dry run publishing
        shell: bash
        run: |
            cargo-overlay-registry \
                -r local \
                -r local=./target/package/tmp-registry/ \
                -r crates.io \
                -- \
                cargo publish --workspace --dry-run \
                    -p hyperlight-js-common \
                    -p hyperlight-js \
                    -p hyperlight-js-runtime

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: crates-io-auth

      - name: Validate crate versions
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cargo metadata --no-deps --format-version 1 | jq -e --arg version "$VERSION" '
            [.packages[] | select(.name == "hyperlight-js-common" or
              .name == "hyperlight-js-runtime" or .name == "hyperlight-js")] |
            length == 3 and all(.version == $version)
          ' || {
            echo "::error::All release crate versions must match $VERSION."
            exit 1
          }

      - name: Publish hyperlight-js-common
        run: cargo publish -p hyperlight-js-common
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        if: ${{ env.PUBLISH_HYPERLIGHT_JS_COMMON != 'false' && !inputs.dry_run }}

      - name: Publish hyperlight-js-runtime
        run: cargo publish -p hyperlight-js-runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        if: ${{ env.PUBLISH_HYPERLIGHT_JS_RUNTIME != 'false' && !inputs.dry_run }}

      - name: Publish hyperlight-js
        run: cargo publish -p hyperlight-js
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        if: ${{ env.PUBLISH_HYPERLIGHT_JS != 'false' && !inputs.dry_run }}

      - name: Check published crate archives
        if: ${{ !inputs.dry_run }}
        id: crate-archives
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          target_dir=$(cargo metadata --no-deps --format-version 1 | jq -r '.target_directory')
          mkdir release-crates
          echo 'subjects<<EOF' >> "$GITHUB_OUTPUT"
          for crate in hyperlight-js-common hyperlight-js-runtime hyperlight-js; do
            archive="$crate-$VERSION.crate"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --connect-timeout 10 --max-time 60 \
              "https://static.crates.io/crates/$crate/$archive" \
              --output "release-crates/$archive"
            publish_var="PUBLISH_${crate^^}"
            publish_var=${publish_var//-/_}
            if [ "${!publish_var}" != "false" ]; then
              if ! cmp "$target_dir/package/$archive" "release-crates/$archive"; then
                echo "::error::Published $archive does not match the archive packaged by this workflow."
                exit 1
              fi
              echo "release-crates/$archive" >> "$GITHUB_OUTPUT"
            fi
          done
          echo EOF >> "$GITHUB_OUTPUT"

      - name: Attest crate archives
        if: ${{ !inputs.dry_run && steps.crate-archives.outputs.subjects != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.crate-archives.outputs.subjects }}

      - name: Collect crate attestation bundle
        if: ${{ !inputs.dry_run }}
        working-directory: release-crates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          : > crates-provenance.sigstore.jsonl
          for archive in *.crate; do
            gh attestation download "$archive" --repo "$GH_REPO" \
              --predicate-type https://slsa.dev/provenance/v1
            digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
            cat "sha256:$digest.jsonl" >> crates-provenance.sigstore.jsonl
            rm "sha256:$digest.jsonl"
          done

      - name: Upload attested crates
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-crates
          path: release-crates/
          if-no-files-found: error
          overwrite: true
