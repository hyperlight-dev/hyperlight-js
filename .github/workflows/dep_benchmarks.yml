# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Run benchmarks

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip the benchmarks when "true"
        required: false
        type: string
        default: "false"
      download-benchmarks:
        required: true
        type: boolean
      upload-benchmarks:
        required: true
        type: boolean
      environment: 
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  benchmark:
    if: ${{ inputs.docs_only == 'false' }}
    timeout-minutes: ${{ fromJSON(vars.BENCHMARKS_JOB_TIMEOUT || '60') }}
    environment: ${{ inputs.environment }}
    strategy:
        fail-fast: true
        matrix:
          build: [windows-2025-release, linux-kvm-release, linux-hyperv3-release]
          include:
            - build: windows-2025-release
              os: [self-hosted, Windows, X64, "1ES.Pool=hld-win2025-amd"]
              hypervisor: whp
            - build: linux-kvm-release
              os: [self-hosted, Linux, X64, "1ES.Pool=hld-kvm-amd"]
              hypervisor: kvm
            - build: linux-hyperv3-release
              os: [self-hosted, Linux, X64, "1ES.Pool=hld-azlinux3-mshv-amd"]
              hypervisor: hyperv3
    runs-on: ${{ fromJson(
      format('["self-hosted", "{0}", "X64", "1ES.Pool=hld-{1}-amd", "JobId=benchmark-{2}-{3}-{4}-{5}"]',
        matrix.hypervisor == 'whp' && 'Windows' || 'Linux',
        matrix.hypervisor == 'whp' && 'win2025' || matrix.hypervisor == 'hyperv3' && 'azlinux3-mshv' || 'kvm',
        matrix.build,
        github.run_id,
        github.run_number,
        github.run_attempt)) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: hyperlight-dev/ci-setup-workflow@59673866360458f8dd035f4a9fa766aeebad2038 # v2.3.1
        with:
          just-version: "1.51"

      - name: Install github-cli (Azure Linux)
        if: runner.os == 'Linux' && matrix.hypervisor == 'mshv3'
        run: sudo dnf install gh -y

      - name: Install github-cli (Linux ubuntu)
        if: runner.os == 'Linux' && matrix.hypervisor == 'kvm'
        run: sudo apt install gh -y

      # Restores the entries PrimeCaches saves for the release build job of
      # the same name. The Rust cache key hashes the CARGO_* and RUST_*
      # variables, so this workflow sets them only on later steps.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: ${{ matrix.build }}
          save-if: "false"

      - name: Restore sysroot cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/hyperlight-js-runtime/sysroot
          key: sysroot-${{ matrix.build }}-${{ hashFiles('rust-toolchain.toml') }}
          
      # Temporary workaround until hyperlight-host preserves the surrogate
      # inside OUT_DIR. rust-cache removes it but retains build-script state.
      # can be removed once a hyperlight-host with https://github.com/hyperlight-dev/hyperlight/pull/2038 is referenced.
      - name: Invalidate cached Windows surrogate build
        if: runner.os == 'Windows'
        run: cargo clean -p hyperlight-host --profile release

      - name: Build
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: full
        run: |
            just build-rust release

        ## Download benchmarks from "latest" release
      - name: Download benchmarks from latest release
        run: |
          just bench-download ${{ runner.os }} ${{ matrix.hypervisor }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        if: ${{ inputs.download-benchmarks }}

      - name: Run benchmarks
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: full
        run: |
          just bench-ci dev release
        working-directory: ./src/hyperlight-js 

      - name: Upload benchmarks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmarks_${{runner.os}}_${{matrix.hypervisor}}
          path: ./target/criterion/
          if-no-files-found: error
        if: ${{ inputs.upload-benchmarks }}
