# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build hyperlight-js

on:
  workflow_call:
    inputs:
      environment: 
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: true
      matrix:
        build: [windows-2025-debug, linux-kvm-debug, linux-kvm-arm64-debug, linux-hyperv3-debug, macos-hvf-debug, windows-2025-release, linux-kvm-release, linux-kvm-arm64-release, linux-hyperv3-release, macos-hvf-release]
        include:
          - build: windows-2025-debug
            os: [self-hosted, Windows, X64, "1ES.Pool=hld-win2025-amd"]
            hypervisor: whp
            config: debug
          - build: linux-kvm-debug
            os: [self-hosted, Linux, X64, "1ES.Pool=hld-kvm-amd"]
            hypervisor: kvm
            arch: X64
            config: debug
          - build: linux-kvm-arm64-debug
            os: [self-hosted, Linux, arm64, kvm]
            hypervisor: kvm
            arch: arm64
            config: debug
          - build: linux-hyperv3-debug
            os: [self-hosted, Linux, X64, "1ES.Pool=hld-azlinux3-mshv-amd"]
            hypervisor: hyperv3
            config: debug
          - build: macos-hvf-debug
            os: [self-hosted, macos, arm64, hvf]
            hypervisor: hvf
            config: debug
          - build: windows-2025-release
            os: [self-hosted, Windows, X64, "1ES.Pool=hld-win2025-amd"]
            hypervisor: whp
            config: release
          - build: linux-kvm-release
            os: [self-hosted, Linux, X64, "1ES.Pool=hld-kvm-amd"]
            hypervisor: kvm
            arch: X64
            config: release
          - build: linux-kvm-arm64-release
            os: [self-hosted, Linux, arm64, kvm]
            hypervisor: kvm
            arch: arm64
            config: release
          - build: linux-hyperv3-release
            os: [self-hosted, Linux, X64, "1ES.Pool=hld-azlinux3-mshv-amd"]
            hypervisor: hyperv3
            config: release
          - build: macos-hvf-release
            os: [self-hosted, macos, arm64, hvf]
            hypervisor: hvf
            config: release
    runs-on: ${{ fromJson(matrix.hypervisor == 'hvf'
      && '["self-hosted", "macos", "arm64", "hvf"]'
      || matrix.arch == 'arm64'
      && '["self-hosted", "Linux", "arm64", "kvm"]'
      || format('["self-hosted", "{0}", "X64", "1ES.Pool=hld-{1}-amd", "JobId=build-{2}-{3}-{4}-{5}"]',
        matrix.hypervisor == 'whp' && 'Windows' || 'Linux',
        matrix.hypervisor == 'whp' && 'win2025' || matrix.hypervisor == 'hyperv3' && 'azlinux3-mshv' || 'kvm',
        matrix.build,
        github.run_id,
        github.run_number,
        github.run_attempt)) }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: hyperlight-dev/ci-setup-workflow@v1.10.0
      with:
          rust-toolchain: "1.90"
          just-version: "1.51"

    - name: install nodejs
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'src/js-host-api/package-lock.json'

    - name: fmt
      run: just fmt-check

    - name: Build
      run: |
          just build ${{ matrix.config }}

    - name: Build js-host-api
      run: |
          just build-js-host-api ${{ matrix.config }}

    - name: lint
      run: just lint ${{ matrix.config }}

    - name: test
      run: just test-all ${{ matrix.config }}

    - name: Run Rust examples
      run: just run-examples ${{ matrix.config }}

    - name: Run node examples
      run: just run-js-host-api-examples ${{ matrix.config }}

    - name: Run Rust examples (tracing)
      env:
        CARGO_TERM_COLOR: always
        RUST_LOG: debug
      run: just run-examples-tracing ${{ matrix.config }}