# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  create-gh-release:
    environment: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Hyperlight setup
        uses: hyperlight-dev/ci-setup-workflow@59673866360458f8dd035f4a9fa766aeebad2038 # v2.3.1
        with:
          just-version: "1.51"

      - name: Generate release notes from the changelog and merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_TAG: ${{ inputs.dry_run && 'dev-latest' || format('v{0}', inputs.version) }}
        run: just create-release-notes "$NOTES_TAG" > RELEASE_NOTES.md

      - name: Download benchmarks (Windows)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmarks_Windows_whp
          path: benchmarks_Windows_whp

      - name: Download benchmarks (Linux kvm)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmarks_Linux_kvm
          path: benchmarks_Linux_kvm

      - name: Download benchmarks (Linux hyperv3)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmarks_Linux_hyperv3
          path: benchmarks_Linux_hyperv3
  
      - name: Archive benchmarks
        run: |
          tar -zcvf benchmarks_Windows_whp.tar.gz benchmarks_Windows_whp
          tar -zcvf benchmarks_Linux_kvm.tar.gz benchmarks_Linux_kvm
          tar -zcvf benchmarks_Linux_hyperv3.tar.gz benchmarks_Linux_hyperv3

      - name: Download attested crates
        if: ${{ !inputs.dry_run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-crates
          path: release-crates

      - name: Verify crate provenance
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for archive in release-crates/*.crate; do
            gh attestation verify "$archive" --repo "$GH_REPO" \
              --bundle release-crates/crates-provenance.sigstore.jsonl \
              --signer-workflow "$GH_REPO/.github/workflows/cargo-publish.yml" \
              --source-digest "$GITHUB_SHA"
          done

      - name: Publish completed GH Release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
        run: |
          draft=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          if [ "$draft" == "false" ]; then
            gh release verify "$TAG"
            for archive in release-crates/*.crate; do
              gh release verify-asset "$TAG" "$archive"
            done
            exit 0
          fi
          if [ -z "$draft" ]; then
            gh release create "$TAG" --verify-tag --draft --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" --clobber \
            benchmarks_Windows_whp.tar.gz \
            benchmarks_Linux_kvm.tar.gz \
            benchmarks_Linux_hyperv3.tar.gz \
            release-crates/*.crate \
            release-crates/crates-provenance.sigstore.jsonl
          gh release edit "$TAG" --notes-file RELEASE_NOTES.md --draft=false
          gh release verify "$TAG"
          for asset in benchmarks_*.tar.gz release-crates/*; do
            gh release verify-asset "$TAG" "$asset"
          done
