# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: false
  # IMPORTANT: Trusted publishing (OIDC) is configured on npmjs.com with
  # workflow filename 'CreateRelease.yml'. npm checks the *calling* workflow
  # for workflow_call, not the reusable workflow that runs npm publish.
  # Calling this workflow from a different parent workflow will fail OIDC auth.
  # See: https://docs.npmjs.com/trusted-publishers#troubleshooting
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  WORKING_DIR: src/js-host-api
  # Comma-delimited npm package names that have not yet been published and
  # therefore cannot have a trusted publisher configured. Remove each package
  # in a follow-up PR after its first release and trusted-publisher setup.
  FIRST_TIME_PACKAGES: ",@hyperlight-dev/js-host-api-darwin-arm64,@hyperlight-dev/js-host-api-linux-arm64-gnu,@hyperlight-dev/js-host-api-win32-arm64-msvc,"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: [self-hosted, Linux, X64, "1ES.Pool=hld-kvm-amd"]
            build_name: linux-x64-gnu
          - target: x86_64-unknown-linux-musl
            os: [self-hosted, Linux, X64, "1ES.Pool=hld-kvm-amd"]
            build_name: linux-x64-musl
          - target: x86_64-pc-windows-msvc
            os: [self-hosted, Windows, X64, "1ES.Pool=hld-win2025-amd"]
            build_name: win32-x64-msvc
          - target: aarch64-pc-windows-msvc
            os: [self-hosted, Windows, ARM64, "1ES.Pool=hl-windows-arm"]
            build_name: win32-arm64-msvc
          - target: aarch64-apple-darwin
            os: macos-15
            build_name: darwin-arm64
          - target: aarch64-unknown-linux-gnu
            os: [self-hosted, Linux, arm64, kvm]
            build_name: linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Hyperlight setup
        uses: hyperlight-dev/ci-setup-workflow@2f4142ba17cf573af44fc1e1f1ffc743daded5b3 # v1.10.0
        with:
          rust-toolchain: "1.90"
          just-version: "1.51"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
          cache: 'npm'
          cache-dependency-path: 'src/js-host-api/package-lock.json'

      # Building js-host-api runs hyperlight-js's build.rs, which builds the JS
      # guest runtime for a bare-metal ELF target. macOS's system archiver
      # cannot produce ELF archives, and cargo-hyperlight silently falls back to
      # it when llvm-ar is absent from PATH, leaving every QuickJS and libc
      # symbol undefined at the guest link. Prefer a provisioned llvm-ar and
      # fall back to the active Rust toolchain's llvm-tools component.
      - name: Set up LLVM guest toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if command -v llvm-ar >/dev/null 2>&1; then
            echo "Using provisioned llvm-ar from PATH"
            llvm-ar --version
          else
            llvm_bin="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
            for attempt in 1 2 3; do
              if [ -x "$llvm_bin/llvm-ar" ]; then
                break
              fi
              echo "Installing llvm-tools (attempt $attempt)"
              if ! rustup component add llvm-tools; then
                echo "llvm-tools installation attempt $attempt failed" >&2
              fi
              [ -x "$llvm_bin/llvm-ar" ] || sleep $((attempt * 10))
            done
            if [ ! -x "$llvm_bin/llvm-ar" ]; then
              echo "llvm-ar not found on PATH or in $llvm_bin" >&2
              exit 1
            fi
            echo "$llvm_bin" >> "$GITHUB_PATH"
            "$llvm_bin/llvm-ar" --version
          fi

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --ignore-scripts --omit=optional

      - name: Set package version
        working-directory: ${{ env.WORKING_DIR }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add musl Rust target
        if: contains(matrix.target, 'musl')
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build native module
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bindings-${{ matrix.build_name }}
          path: ${{ env.WORKING_DIR }}/*.node
          if-no-files-found: error

      # index.js and index.d.ts are generated by napi build and are
      # platform-independent, so we only need to upload them once.
      - name: Upload JS bindings
        if: matrix.build_name == 'linux-x64-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: js-bindings
          path: |
            ${{ env.WORKING_DIR }}/index.js
            ${{ env.WORKING_DIR }}/index.d.ts
          if-no-files-found: error

  package-targets:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.packages.outputs.all }}
      first_time: ${{ steps.packages.outputs.first_time }}
    steps:
      - id: packages
        shell: bash
        env:
          FIRST_TIME_PACKAGES: ${{ env.FIRST_TIME_PACKAGES }}
        run: |
          python - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          targets = [
            {
              "package_name": "@hyperlight-dev/js-host-api-linux-x64-gnu",
              "artifact_name": "bindings-linux-x64-gnu",
              "artifact_dir": "linux-x64-gnu",
              "node_arch": "x64",
              "runner": ["self-hosted", "Linux", "X64", "1ES.Pool=hld-kvm-amd"],
              "shell": "bash",
              "verify_command": "test \"$(uname -m)\" = \"x86_64\"\ntest \"$(node -p process.arch)\" = \"x64\"",
              "prepare_command": "mv artifacts/linux-x64-gnu/*.node npm/linux-x64-gnu/js-host-api.linux-x64-gnu.node\nmv js-bindings/index.js index.js\nmv js-bindings/index.d.ts index.d.ts",
              "version_command": "npm version \"$VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts\ncd npm/linux-x64-gnu\nnpm version \"$VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts",
              "update_dependency_command": "node -e \"const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.optionalDependencies['@hyperlight-dev/js-host-api-linux-x64-gnu'] = process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\\\n');\"",
              "validate_command": "./test-pack.sh",
              "validate_env": {"PLATFORM_PACKAGE": "linux-x64-gnu"},
            },
            {
              "package_name": "@hyperlight-dev/js-host-api-linux-x64-musl",
              "artifact_name": "bindings-linux-x64-musl",
              "artifact_dir": "linux-x64-musl",
              "node_arch": "x64",
              "runner": ["self-hosted", "Linux", "X64", "1ES.Pool=hld-kvm-amd"],
              "shell": "bash",
              "verify_command": "test \"$(uname -m)\" = \"x86_64\"\ntest \"$(node -p process.arch)\" = \"x64\"",
              "prepare_command": "mv artifacts/linux-x64-musl/*.node npm/linux-x64-musl/js-host-api.linux-x64-musl.node\nmv js-bindings/index.js index.js\nmv js-bindings/index.d.ts index.d.ts",
              "version_command": "npm version \"$VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts\ncd npm/linux-x64-musl\nnpm version \"$VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts",
              "update_dependency_command": "node -e \"const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.optionalDependencies['@hyperlight-dev/js-host-api-linux-x64-musl'] = process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\\\n');\"",
              "validate_command": "./test-pack.sh",
              "validate_env": {"PLATFORM_PACKAGE": "linux-x64-musl"},
            },
            {
              "package_name": "@hyperlight-dev/js-host-api-win32-x64-msvc",
              "artifact_name": "bindings-win32-x64-msvc",
              "artifact_dir": "win32-x64-msvc",
              "node_arch": "x64",
              "runner": ["self-hosted", "Windows", "X64", "1ES.Pool=hld-win2025-amd"],
              "shell": "pwsh",
              "verify_command": "$platform = node -p \"process.platform + '-' + process.arch\"\nif ($LASTEXITCODE -ne 0 -or $platform -ne 'win32-x64') { throw 'Windows x64 package validation requires native x64 Node.js on Windows' }",
              "prepare_command": "Move-Item artifacts\\win32-x64-msvc\\*.node npm\\win32-x64-msvc\\js-host-api.win32-x64-msvc.node\nMove-Item js-bindings\\index.js index.js\nMove-Item js-bindings\\index.d.ts index.d.ts",
              "version_command": "npm version \"$env:VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts\nPush-Location npm\\win32-x64-msvc\ntry { npm version \"$env:VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts } finally { Pop-Location }",
              "update_dependency_command": "$pkg = Get-Content package.json -Raw | ConvertFrom-Json; $pkg.optionalDependencies.'@hyperlight-dev/js-host-api-win32-x64-msvc' = $env:VERSION; $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json",
              "validate_command": ".\\test-pack.ps1",
              "validate_env": {},
            },
            {
              "package_name": "@hyperlight-dev/js-host-api-win32-arm64-msvc",
              "artifact_name": "bindings-win32-arm64-msvc",
              "artifact_dir": "win32-arm64-msvc",
              "node_arch": "arm64",
              "runner": ["self-hosted", "Windows", "ARM64", "1ES.Pool=hl-windows-arm"],
              "shell": "pwsh",
              "verify_command": "$platform = node -p \"process.platform + '-' + process.arch\"\nif ($LASTEXITCODE -ne 0 -or $platform -ne 'win32-arm64') { throw 'Windows ARM64 package validation requires native ARM64 Node.js on Windows' }",
              "prepare_command": "Move-Item artifacts\\win32-arm64-msvc\\*.node npm\\win32-arm64-msvc\\js-host-api.win32-arm64-msvc.node\nMove-Item js-bindings\\index.js index.js\nMove-Item js-bindings\\index.d.ts index.d.ts",
              "version_command": "npm version \"$env:VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts\nPush-Location npm\\win32-arm64-msvc\ntry { npm version \"$env:VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts } finally { Pop-Location }",
              "update_dependency_command": "$pkg = Get-Content package.json -Raw | ConvertFrom-Json; $pkg.optionalDependencies.'@hyperlight-dev/js-host-api-win32-arm64-msvc' = $env:VERSION; $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json",
              "validate_command": ".\\test-pack.ps1",
              "validate_env": {},
            },
            {
              "package_name": "@hyperlight-dev/js-host-api-darwin-arm64",
              "artifact_name": "bindings-darwin-arm64",
              "artifact_dir": "darwin-arm64",
              "node_arch": "arm64",
              "runner": "macos-15",
              "shell": "bash",
              "verify_command": "test \"$(uname -m)\" = \"arm64\"\ntest \"$(node -p process.arch)\" = \"arm64\"",
              "prepare_command": "mv artifacts/darwin-arm64/*.node npm/darwin-arm64/js-host-api.darwin-arm64.node\nmv js-bindings/index.js index.js\nmv js-bindings/index.d.ts index.d.ts",
              "version_command": "npm version \"$VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts\ncd npm/darwin-arm64\nnpm version \"$VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts",
              "update_dependency_command": "node -e \"const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.optionalDependencies['@hyperlight-dev/js-host-api-darwin-arm64'] = process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\\\n');\"",
              "validate_command": "./test-pack.sh",
              "validate_env": {"PLATFORM_PACKAGE": "darwin-arm64", "REQUIRE_MACOS_PACKAGE": "1"},
            },
            {
              "package_name": "@hyperlight-dev/js-host-api-linux-arm64-gnu",
              "artifact_name": "bindings-linux-arm64-gnu",
              "artifact_dir": "linux-arm64-gnu",
              "node_arch": "arm64",
              "runner": ["self-hosted", "Linux", "arm64", "kvm"],
              "shell": "bash",
              "verify_command": "test \"$(uname -m)\" = \"aarch64\"\ntest \"$(node -p process.arch)\" = \"arm64\"",
              "prepare_command": "mv artifacts/linux-arm64-gnu/*.node npm/linux-arm64-gnu/js-host-api.linux-arm64-gnu.node\nmv js-bindings/index.js index.js\nmv js-bindings/index.d.ts index.d.ts",
              "version_command": "npm version \"$VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts\ncd npm/linux-arm64-gnu\nnpm version \"$VERSION\" --no-git-tag-version --allow-same-version --ignore-scripts",
              "update_dependency_command": "node -e \"const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.optionalDependencies['@hyperlight-dev/js-host-api-linux-arm64-gnu'] = process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\\\n');\"",
              "validate_command": "./test-pack.sh",
              "validate_env": {"PLATFORM_PACKAGE": "linux-arm64-gnu"},
            },
          ]
          first_time = {pkg.strip() for pkg in os.environ.get('FIRST_TIME_PACKAGES', '').split(',') if pkg.strip()}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"all={json.dumps(targets)}\n")
              fh.write(f"first_time={json.dumps([t for t in targets if t['package_name'] in first_time])}\n")
          PY

  validate-native:
    if: ${{ needs.build.result == 'success' && needs.package-targets.outputs.first_time != '[]' }}
    needs: [build, package-targets]
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.package-targets.outputs.first_time) }}
    runs-on: ${{ matrix.runner }}
    # Step-level shell does not support expressions; job defaults do.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.3'
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'
          cache-dependency-path: 'src/js-host-api/package-lock.json'

      - name: Verify native runner
        run: ${{ matrix.verify_command }}

      - name: Download native artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.WORKING_DIR }}/artifacts/${{ matrix.artifact_dir }}

      - name: Download JS bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: js-bindings
          path: ${{ env.WORKING_DIR }}/js-bindings

      - name: Prepare native package
        working-directory: ${{ env.WORKING_DIR }}
        run: ${{ matrix.prepare_command }}

      - name: Set package versions
        working-directory: ${{ env.WORKING_DIR }}
        env:
          VERSION: ${{ inputs.version }}
        run: ${{ matrix.version_command }}

      - name: Update optional dependency version
        working-directory: ${{ env.WORKING_DIR }}
        env:
          VERSION: ${{ inputs.version }}
        run: ${{ matrix.update_dependency_command }}

      - name: Validate native release tarballs
        working-directory: ${{ env.WORKING_DIR }}
        env:
          PLATFORM_PACKAGE: ${{ matrix.artifact_dir }}
          REQUIRE_MACOS_PACKAGE: ${{ contains(matrix.package_name, 'darwin') && '1' || '' }}
        run: ${{ matrix.validate_command }}

  publish:
    if: ${{ always() && needs.build.result == 'success' && (needs.validate-native.result == 'success' || needs.validate-native.result == 'skipped') }}
    needs: [build, validate-native]
    # Trusted publishing (OIDC) requires GitHub-hosted runners.
    # The publish job only downloads pre-built artifacts and runs npm publish,
    # so it does not need self-hosted runners with KVM/Hyperlight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        run: |
          # This is required for the Validate packages.
          sudo modprobe kvm || true
          sudo modprobe kvm_intel || true
          sudo modprobe kvm_amd || true
          sudo chmod a+rwx /dev/kvm

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # node 22.22.2 has an issue where we can't upgrade npm to 11.x
          # see https://github.com/nodejs/node/issues/62425
          node-version: '22.22.3'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: 'src/js-host-api/package-lock.json'

      # Trusted publishing requires npm 11.5.1+ (Node 22 ships with npm 10.x)
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Validate version format
        run: npx --yes semver "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --ignore-scripts --omit=optional

      - name: Download Linux GNU artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bindings-linux-x64-gnu
          path: ${{ env.WORKING_DIR }}/artifacts/linux-x64-gnu

      - name: Download Linux musl artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bindings-linux-x64-musl
          path: ${{ env.WORKING_DIR }}/artifacts/linux-x64-musl

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bindings-win32-x64-msvc
          path: ${{ env.WORKING_DIR }}/artifacts/win32-x64-msvc

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bindings-darwin-arm64
          path: ${{ env.WORKING_DIR }}/artifacts/darwin-arm64

      - name: Download Windows arm64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bindings-win32-arm64-msvc
          path: ${{ env.WORKING_DIR }}/artifacts/win32-arm64-msvc

      - name: Download Linux arm64 GNU artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bindings-linux-arm64-gnu
          path: ${{ env.WORKING_DIR }}/artifacts/linux-arm64-gnu

      - name: Download JS bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: js-bindings
          path: ${{ env.WORKING_DIR }}/js-bindings

      - name: List artifacts
        run: ls -la ${{ env.WORKING_DIR }}/artifacts/*/

      - name: Move artifacts to npm directories
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Rename artifacts to match napi-rs naming convention
          mv artifacts/linux-x64-gnu/*.node npm/linux-x64-gnu/js-host-api.linux-x64-gnu.node
          mv artifacts/linux-x64-musl/*.node npm/linux-x64-musl/js-host-api.linux-x64-musl.node
          mv artifacts/win32-x64-msvc/*.node npm/win32-x64-msvc/js-host-api.win32-x64-msvc.node
          mv artifacts/win32-arm64-msvc/*.node npm/win32-arm64-msvc/js-host-api.win32-arm64-msvc.node
          mv artifacts/darwin-arm64/*.node npm/darwin-arm64/js-host-api.darwin-arm64.node
          mv artifacts/linux-arm64-gnu/*.node npm/linux-arm64-gnu/js-host-api.linux-arm64-gnu.node
          ls -la npm/linux-x64-gnu/
          ls -la npm/linux-x64-musl/
          ls -la npm/win32-x64-msvc/
          ls -la npm/win32-arm64-msvc/
          ls -la npm/darwin-arm64/
          ls -la npm/linux-arm64-gnu/

      - name: Set package versions
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Update main package version
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          
          # Update platform package versions
          cd npm/linux-x64-gnu && npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../linux-x64-musl && npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../win32-x64-msvc && npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../win32-arm64-msvc && npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../darwin-arm64 && npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../linux-arm64-gnu && npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ inputs.version }}

      - name: Update optionalDependencies versions
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Update only @hyperlight platform package versions (not other optionalDeps)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              if (dep.startsWith('@hyperlight-dev/js-host-api-')) {
                pkg.optionalDependencies[dep] = process.env.VERSION;
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cat package.json
        env:
          VERSION: ${{ inputs.version }}

      - name: Install JS bindings (index.js and index.d.ts)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # index.js and index.d.ts are generated by napi build and uploaded
          # from the linux-x64-gnu build job.
          ls -la js-bindings/
          mv js-bindings/index.js index.js
          mv js-bindings/index.d.ts index.d.ts
          ls -la index.js index.d.ts

      - name: Validate packages
        working-directory: ${{ env.WORKING_DIR }}
        run: ./test-pack.sh
        env:
          REQUIRE_MACOS_PACKAGE: "1"

      # ── Authentication strategy ────────────────────────────────────
      # Established packages use trusted publishing (OIDC). Packages listed
      # in FIRST_TIME_PACKAGES use NPM_TOKEN for this release only because
      # npm has no trusted-publisher configuration until the package exists.
      - name: Validate NPM_TOKEN for token-published packages
        if: ${{ !inputs.dry_run && (github.event_name == 'workflow_dispatch' || env.FIRST_TIME_PACKAGES != '') }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN repo secret is required for manual publishing or first-time packages."
            echo "::error::See docs/release.md for the first-time package bootstrap procedure."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Linux GNU package
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}/npm/linux-x64-gnu
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || contains(env.FIRST_TIME_PACKAGES, ',@hyperlight-dev/js-host-api-linux-x64-gnu,')) && secrets.NPM_TOKEN || '' }}

      - name: Publish Linux musl package
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}/npm/linux-x64-musl
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || contains(env.FIRST_TIME_PACKAGES, ',@hyperlight-dev/js-host-api-linux-x64-musl,')) && secrets.NPM_TOKEN || '' }}

      - name: Publish Windows package
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}/npm/win32-x64-msvc
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || contains(env.FIRST_TIME_PACKAGES, ',@hyperlight-dev/js-host-api-win32-x64-msvc,')) && secrets.NPM_TOKEN || '' }}

      - name: Publish macOS arm64 package
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}/npm/darwin-arm64
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || contains(env.FIRST_TIME_PACKAGES, ',@hyperlight-dev/js-host-api-darwin-arm64,')) && secrets.NPM_TOKEN || '' }}

      - name: Publish Windows arm64 package
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}/npm/win32-arm64-msvc
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || contains(env.FIRST_TIME_PACKAGES, ',@hyperlight-dev/js-host-api-win32-arm64-msvc,')) && secrets.NPM_TOKEN || '' }}

      - name: Publish Linux arm64 GNU package
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}/npm/linux-arm64-gnu
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || contains(env.FIRST_TIME_PACKAGES, ',@hyperlight-dev/js-host-api-linux-arm64-gnu,')) && secrets.NPM_TOKEN || '' }}

      - name: Publish main package
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || contains(env.FIRST_TIME_PACKAGES, ',@hyperlight-dev/js-host-api,')) && secrets.NPM_TOKEN || '' }}

      - name: Verify all packages published
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Waiting for registry propagation..."
          sleep 15
          FAILED=0
          for pkg in "@hyperlight-dev/js-host-api" \
                     "@hyperlight-dev/js-host-api-linux-x64-gnu" \
                     "@hyperlight-dev/js-host-api-linux-x64-musl" \
                     "@hyperlight-dev/js-host-api-win32-x64-msvc" \
                     "@hyperlight-dev/js-host-api-win32-arm64-msvc" \
                     "@hyperlight-dev/js-host-api-darwin-arm64" \
                     "@hyperlight-dev/js-host-api-linux-arm64-gnu"; do
            if npm view "$pkg@$VERSION" version > /dev/null 2>&1; then
              echo "✅ $pkg@$VERSION published"
            else
              echo "::error::❌ $pkg@$VERSION NOT found on registry!"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Some packages failed to publish. Check above for details."
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Dry run - show what would be published
        if: ${{ inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=== DRY RUN - Would publish the following packages ==="
          echo ""
          echo "--- @hyperlight-dev/js-host-api-linux-x64-gnu ---"
          npm pack ./npm/linux-x64-gnu --dry-run
          echo ""
          echo "--- @hyperlight-dev/js-host-api-linux-x64-musl ---"
          npm pack ./npm/linux-x64-musl --dry-run
          echo ""
          echo "--- @hyperlight-dev/js-host-api-win32-x64-msvc ---"
          npm pack ./npm/win32-x64-msvc --dry-run
          echo ""
          echo "--- @hyperlight-dev/js-host-api-win32-arm64-msvc ---"
          npm pack ./npm/win32-arm64-msvc --dry-run
          echo ""
          echo "--- @hyperlight-dev/js-host-api-darwin-arm64 ---"
          npm pack ./npm/darwin-arm64 --dry-run
          echo ""
          echo "--- @hyperlight-dev/js-host-api-linux-arm64-gnu ---"
          npm pack ./npm/linux-arm64-gnu --dry-run
          echo ""
          echo "--- @hyperlight-dev/js-host-api ---"
          npm pack --dry-run