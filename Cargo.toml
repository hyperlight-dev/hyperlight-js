[workspace]
resolver = "2"
members = ["src/hyperlight-js", "src/js-host-api", "src/hyperlight-js-runtime", "src/hyperlight-js-common"]
exclude = ["src/hyperlight-js-runtime/tests/fixtures"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/hyperlight-dev/hyperlight-js"
readme = "README.md"

[workspace.dependencies]
# Keep the host and guest on the same pre-release transport revision.
hyperlight-guest-bin = { git = "https://github.com/hyperlight-dev/hyperlight", rev = "05cf69ef6544378d6e9875c1372b3513e17e4fc2", features = ["libc"] }
hyperlight-host = { git = "https://github.com/hyperlight-dev/hyperlight", rev = "05cf69ef6544378d6e9875c1372b3513e17e4fc2", default-features = false }
hyperlight-common = { git = "https://github.com/hyperlight-dev/hyperlight", rev = "05cf69ef6544378d6e9875c1372b3513e17e4fc2", default-features = false }
hyperlight-guest = { git = "https://github.com/hyperlight-dev/hyperlight", rev = "05cf69ef6544378d6e9875c1372b3513e17e4fc2" }

hyperlight-js = { version = "0.4.0", path = "src/hyperlight-js" }
hyperlight-js-runtime = { version = "0.4.0", path = "src/hyperlight-js-runtime" }
hyperlight-js-common = { version = "0.4.0", path = "src/hyperlight-js-common" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
